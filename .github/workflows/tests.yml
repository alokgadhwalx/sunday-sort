name: tests

on:
  push:
  pull_request:

jobs:
  test:
    name: ${{ matrix.shell == 'powershell' && 'Windows PowerShell 5.1' || 'PowerShell 7' }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        shell: [powershell, pwsh]
    steps:
      - uses: actions/checkout@v4
      - name: Run tests
        shell: pwsh
        run: |
          ${{ matrix.shell }} -NoProfile -ExecutionPolicy Bypass -File ./tests/Run-Tests.ps1
          exit $LASTEXITCODE
